  <body>

    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="index.html"><span class="brand-mark">有空</span><span class="brand-text">有空客厅</span></a>
        <button class="menu-toggle" type="button" aria-label="打开导航" aria-expanded="false"><span></span><span></span><span></span></button>

        </nav>
      </div>
    </header>

    <main id="main" data-activity-feedback-page>
      <section class="page-hero">
        <div class="wrap">
          <p class="eyebrow">活动反馈</p>
          <h1 data-feedback-activity-title>正在读取活动...</h1>
          <p data-feedback-activity-summary>活动结束后，可以把二维码发给参与者留下匿名反馈。</p>
        </div>
      </section>

      <section class="section alt">
        <div class="wrap editor-layout">
          <div class="form-note qr-download-panel">
            <h3>反馈二维码</h3>
            <div class="qr-preview" data-feedback-qr>正在生成二维码...</div>
            <div class="button-row">
              <a class="button primary" data-open-feedback-form href="feedback.html">打开问卷</a>
              <button class="button outline" type="button" data-download-feedback-qr>下载反馈二维码</button>
            </div>
          </div>
          <aside class="panel-block sticky-panel">
            <p class="section-kicker">展示规则</p>
            <h3>公开页只展示通过反馈。</h3>
            <p class="muted-text">如果活动设置为展示评价，活动详情页会默认展示 AI 权重最高的前三条已通过反馈。</p>
          </aside>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <div class="list-toolbar">
            <span data-activity-feedback-count>正在读取反馈...</span>
          </div>
          <div class="event-list rows" data-activity-feedback-list></div>
          <button class="button ghost load-more" type="button" data-load-more-activity-feedbacks hidden>加载更多</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-grid">
