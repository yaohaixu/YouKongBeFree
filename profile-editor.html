<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>编辑公开资料｜有空客厅</title>
    <meta name="description" content="编辑有空客厅公开资料，用于活动发起人主页和活动卡展示。" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://youkong-d5gh4x0ayc29a2187.service.tcloudbase.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; form-action 'self'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <script src="theme.js?v=0.28.0"></script>
    <link rel="stylesheet" href="styles.css?v=0.28.0" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="index.html"><span class="brand-mark">有空</span><span class="brand-text">有空客厅</span></a>
        <button class="menu-toggle" type="button" aria-label="打开导航" aria-expanded="false"><span></span><span></span><span></span></button>
        <nav class="nav-links" aria-label="主导航">
          <a href="index.html">首页</a>
          <a href="whitepaper.html">社区共识</a>
          <a href="participate.html">活动与参与</a>
          <a href="donate.html">捐赠支持</a>
          <a href="about.html">关于与联系</a>
          <span class="session-nav" data-session-nav><a href="me.html">我的</a></span>
        </nav>
      </div>
    </header>

    <main id="main" data-profile-editor-page>
      <section class="page-hero compact-hero">
        <div class="wrap">
          <p class="eyebrow">公开资料</p>
          <h1>让别人更容易认识你。</h1>
          <p>头像、昵称和简介会展示在活动卡片、活动详情和发起人主页。不会公开手机号、管理链接或社区信用分。</p>
        </div>
      </section>

      <section class="section alt">
        <div class="wrap profile-settings-layout">
          <article class="profile-summary-card">
            <div data-profile-avatar>
              <span class="profile-avatar large-avatar" aria-hidden="true">有空</span>
            </div>
            <div>
              <p class="section-kicker">预览</p>
              <h2 data-profile-name>有空朋友</h2>
              <p data-profile-bio>可以写一句你常发起什么、喜欢怎样的公共生活。</p>
              <div class="button-row">
                <a class="button ghost" data-profile-public-link href="profile.html" hidden>查看我的主页</a>
              </div>
            </div>
          </article>
          <form class="form-note profile-form" data-profile-form>
            <h3>编辑公开资料</h3>
            <label>头像<input name="avatar" type="file" accept="image/jpeg,image/png,image/webp,image/gif" /></label>
            <label>昵称<input name="displayName" maxlength="32" placeholder="别人会在活动里看到这个名字" /></label>
            <label>个人简介<textarea name="bio" maxlength="280" rows="4" placeholder="比如：喜欢发起放映、读书和城市散步。"></textarea></label>
            <div class="form-actions">
              <button class="button primary" type="submit">保存资料</button>
              <a class="button outline" href="me.html">回我的工作台</a>
            </div>
            <p class="form-message" data-profile-message></p>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-grid">
        <div><div class="footer-brand">有空客厅</div><div>公开资料只展示你主动填写的内容。</div><div class="credit">网站制作人：海旭</div></div>
        <nav class="footer-links"><a href="me.html">我的</a><a href="activity-editor.html">发起活动</a><a href="activities.html">近期活动</a></nav>
      </div>
    </footer>
    <script src="script.js?v=0.28.0"></script>
    <script src="app.js?v=0.28.0"></script>
  </body>
</html>
