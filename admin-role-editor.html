    <script src="theme.js?v=0.24.1"></script>
    <link rel="stylesheet" href="styles.css?v=0.24.1" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="index.html"><span class="brand-mark">有空</span><span class="brand-text">有空客厅</span></a>
        <button class="menu-toggle" type="button" aria-label="打开导航" aria-expanded="false"><span></span><span></span><span></span></button>
        <nav class="nav-links" aria-label="主导航">
          <a href="index.html">首页</a>
          <a href="whitepaper.html">社区共识</a>
          <a href="participate.html">活动与参与</a>
          <a href="donate.html">捐赠支持</a>
          <a href="about.html">关于与联系</a>
          <span class="session-nav" data-session-nav><a href="me.html">我的</a></span>
        </nav>
      </div>
    </header>

    <main id="main" data-admin-role-editor-page>
      <section class="page-hero">
        <div class="wrap">
          <p class="eyebrow">角色详情</p>
          <h1 data-role-editor-heading>新增一个后台角色。</h1>
          <p>先写清楚这个角色负责什么，再按模块勾选它真正需要的动作权限。内置管理员角色保持锁定，避免误改。</p>
        </div>
      </section>

      <section class="section alt">
        <div class="wrap editor-layout role-editor-layout">
          <form class="form-note role-form-panel" data-role-form>
            <h3 data-role-form-title>新增角色</h3>
            <div class="form-grid compact-form-grid">
              <label>角色标识<input name="key" required placeholder="如 event_operator" /></label>
              <label>角色名称<input name="name" required placeholder="如 活动运营" /></label>
            </div>
            <label>角色说明<textarea name="description" rows="3" placeholder="这个角色负责哪些事情"></textarea></label>
            <div class="permission-editor-head">
              <div>
                <strong>权限配置</strong>
                <p>勾选后立即在当前表单里生效，保存后才会写入系统。</p>
              </div>
              <span data-permission-summary>0 个动作权限</span>
            </div>
            <div class="permission-matrix" data-permission-matrix></div>
            <div class="form-actions">
              <button class="button primary" type="submit" data-role-submit>保存角色</button>
              <a class="button outline" href="admin-roles.html">取消</a>
            </div>
            <p class="form-message" data-role-message></p>
          </form>

          <aside class="panel-block sticky-panel">
            <p class="section-kicker">配置建议</p>
            <h3>少给一点，够用就好。</h3>
            <p class="muted-text">建议先只开放「查看」和必要动作。需要处理复核时再给「审核」，需要维护配置时再给「新增 / 编辑 / 删除 / 配置」。</p>
            <div class="button-row">
              <a class="button ghost" href="admin-roles.html">角色列表</a>
              <a class="button outline" href="admin-members.html">用户管理</a>
              <a class="button outline" href="admin.html">回后台</a>
            </div>
          </aside>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-grid">
        <div><div class="footer-brand">有空客厅</div><div>权限服务于协作，不制造新的迷宫。</div><div class="credit">网站制作人：海旭</div></div>
        <nav class="footer-links"><a href="admin.html">后台</a><a href="admin-roles.html">角色权限</a><a href="admin-members.html">用户管理</a><a href="admin-logs.html">操作日志</a></nav>
      </div>
    </footer>
    <script src="script.js?v=0.24.1"></script>
    <script src="app.js?v=0.24.1"></script>
  </body>
</html>
