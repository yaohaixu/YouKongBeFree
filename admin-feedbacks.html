<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>活动反馈｜有空客厅</title>
    <meta name="description" content="YKadmin 查看、审核和导出活动反馈。" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://youkong-d5gh4x0ayc29a2187.service.tcloudbase.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; form-action 'self'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <script src="theme.js?v=0.29.0"></script>
    <link rel="stylesheet" href="styles.css?v=0.29.0" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="index.html"><span class="brand-mark">有空</span><span class="brand-text">有空客厅</span></a>
        <button class="menu-toggle" type="button" aria-label="打开导航" aria-expanded="false"><span></span><span></span><span></span></button>
        <nav class="nav-links" aria-label="主导航">
          <a href="index.html">首页</a>
          <a href="whitepaper.html">社区共识</a>
          <a href="participate.html">活动与参与</a>
          <a href="donate.html">捐赠支持</a>
          <a href="about.html">关于与联系</a>
          <span class="session-nav" data-session-nav><a href="me.html">我的</a></span>
        </nav>
      </div>
    </header>

    <main id="main" data-admin-feedbacks-page>
      <section class="page-hero">
        <div class="wrap">
          <p class="eyebrow">Activity Feedback</p>
          <h1>看见活动之后留下的话。</h1>
          <p>匿名反馈先经 AI 分析；不适合公开的内容进入这里由管理员决定展示或不展示。</p>
        </div>
      </section>

      <section class="section alt">
        <div class="wrap">
          <form class="filter-panel wide" data-feedback-filters>
            <label>搜索<input name="q" placeholder="活动 / 反馈 / AI 说明 / 身份" /></label>
            <label>状态
              <select name="status">
                <option value="">全部状态</option>
                <option value="approved">已展示</option>
                <option value="admin_review">待管理员审核</option>
                <option value="rejected">不展示</option>
              </select>
            </label>
            <label>开始日期<input name="from" type="date" /></label>
            <label>结束日期<input name="to" type="date" /></label>
            <button class="button ghost" type="submit">筛选</button>
          </form>
          <div class="list-toolbar">
            <span data-feedback-count>正在读取反馈...</span>
            <div class="button-row">
              <button class="button outline" type="button" data-export-feedbacks>导出 CSV</button>
              <a class="button ghost" href="admin.html">回后台</a>
            </div>
          </div>
          <div class="event-list rows" data-feedback-list></div>
          <button class="button ghost load-more" type="button" data-load-more-feedbacks hidden>加载更多</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-grid">
        <div><div class="footer-brand">有空客厅</div><div>反馈不是评分，是复盘材料。</div><div class="credit">网站制作人：海旭</div></div>
        <nav class="footer-links"><a href="admin.html">后台</a><a href="admin-friends.html">客厅的朋友们</a><a href="admin-reports.html">社区举报</a><a href="admin-ai.html">AI 分析</a></nav>
      </div>
    </footer>
    <script src="script.js?v=0.29.0"></script>
    <script src="app.js?v=0.29.0"></script>
  </body>
</html>
