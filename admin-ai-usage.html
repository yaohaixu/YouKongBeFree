    <main id="main" data-admin-ai-usage-page>
      <section class="page-hero">
        <div class="wrap">
          <p class="eyebrow">用量健康</p>
          <h1>用系统视角看 AI 是否可靠、是否昂贵。</h1>
          <p>这里不按单条内容审查，只看整个系统和模型维度的调用量、成功率、耗时、Token 和最近错误。</p>
        </div>
      </section>

      <section class="section alt">
        <div class="wrap">

            <label>统计周期<select name="days"><option value="7">近 7 天</option><option value="30">近 30 天</option><option value="90">近 90 天</option></select></label>

          </form>

          <div class="section-head compact-head">
            <div>
              <p class="section-kicker">模型维度</p>

            </div>
            <a class="button ghost" href="admin-ai.html">AI 控制台</a>
          </div>
          <div class="event-list rows" data-ai-usage-models></div>
          <div class="section-head compact-head ai-error-head">
            <div>
              <p class="section-kicker">最近错误</p>
              <h2>故障转移和配置排查的线索。</h2>

          </div>
