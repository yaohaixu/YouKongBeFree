    <main id="main" data-feedback-form-page>
      <section class="page-hero river compact-hero">
        <div class="wrap">
          <p class="eyebrow">匿名反馈</p>
          <h1 data-feedback-form-title>正在读取活动...</h1>
          <p data-feedback-form-subtitle>不用写名字，也不用打分。留下具体感受就好。</p>
        </div>
      </section>

      <section class="section alt">
        <div class="wrap narrow-wrap">
          <form class="form-note feedback-form" data-activity-feedback-form>
            <label>最喜欢的地方<textarea name="favorite" rows="5" placeholder="哪一刻让你觉得值得来？"></textarea></label>
            <label>可以改进的地方<textarea name="improvement" rows="5" placeholder="如果下次再办，你希望哪里更好一点？"></textarea></label>
            <label>其他想说的<textarea name="other" rows="4" placeholder="给发起人、给客厅、给未来参与者都可以。"></textarea></label>
            <div class="form-actions">
              <button class="button primary" type="submit">提交匿名反馈</button>
              <a class="button ghost" data-feedback-back-link href="activities.html">回到活动</a>
            </div>
            <p class="form-message" data-feedback-form-message></p>
          </form>
        </div>
      </section>
    </main>
