  <body>

    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="index.html"><span class="brand-mark">有空</span><span class="brand-text">有空客厅</span></a>
        <button class="menu-toggle" type="button" aria-label="打开导航" aria-expanded="false"><span></span><span></span><span></span></button>
        <nav class="nav-links" aria-label="主导航">
          <a href="index.html">首页</a>
          <a href="whitepaper.html">社区共识</a>

          <span class="session-nav" data-session-nav><a href="me.html">我的</a></span>
        </nav>
      </div>
    </header>

    <main id="main" data-admin-ai-prompts-page>
      <section class="page-hero">
        <div class="wrap">
          <p class="eyebrow">Prompt 管理</p>
          <h1>Prompt 应该按场景被看见，而不是藏在类型字段里。</h1>
          <p>活动分析、活动反馈、举报复核分别维护版本。启用某个版本后，后续分析会使用新的口径。</p>
        </div>
      </section>

      <section class="section alt">
        <div class="wrap">
          <form class="filter-panel" data-ai-prompt-filters>
            <label>场景<select name="type"><option value="">全部场景</option><option value="activity">活动分析</option><option value="feedback">活动反馈</option><option value="report">举报复核</option></select></label>
            <label>搜索<input name="q" placeholder="Prompt 名称 / 版本 / 内容" /></label>
            <button class="button ghost" type="submit">筛选</button>
          </form>
          <div class="list-toolbar">
            <span data-ai-prompt-count>正在读取 Prompt...</span>
            <div class="row-actions">
              <a class="button primary" href="admin-ai-prompt-editor.html">新增 Prompt</a>
              <a class="button ghost" href="admin-ai.html">AI 控制台</a>
              <a class="button ghost" href="admin.html">回后台</a>
            </div>
          </div>
          <div class="event-list rows" data-ai-prompts></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-grid">

      </div>
    </footer>
