    <meta charset="utf-8" />

    <meta name="description" content="YKadmin 维护客厅的朋友们发起主体。" />

  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="index.html"><span class="brand-mark">有空</span><span class="brand-text">有空客厅</span></a>
        <button class="menu-toggle" type="button" aria-label="打开导航" aria-expanded="false"><span></span><span></span><span></span></button>
        <nav class="nav-links" aria-label="主导航">
          <a href="index.html">首页</a>
          <a href="whitepaper.html">社区共识</a>
          <a href="participate.html">活动与参与</a>
          <a href="donate.html">捐赠支持</a>
          <a href="about.html">关于与联系</a>
          <span class="session-nav" data-session-nav><a href="me.html">我的</a></span>
        </nav>
      </div>
    </header>

    <main id="main" data-admin-friends-page>
      <section class="page-hero">
        <div class="wrap">
          <p class="eyebrow">客厅的朋友们</p>
          <h1>维护可以共同发起活动的朋友主体。</h1>
          <p>这些主体会出现在发起活动页面。停用后不会再被新活动选择，历史活动仍会保留原记录。</p>
        </div>
      </section>

      <section class="section alt">
        <div class="wrap editor-layout">
          <form class="form-note" data-friend-form>
            <h3 data-friend-form-title>新增客厅朋友</h3>
            <div class="form-grid">
              <label>名称<input name="name" required /></label>
              <label>地址<input name="address" /></label>
              <label>联系人<input name="contactName" /></label>
              <label>联系人联系方式<input name="contactInfo" /></label>
              <label>是否启用<select name="enabled"><option value="true">启用</option><option value="false">停用</option></select></label>
              <label>头像 / Logo<input name="logo" type="file" accept="image/jpeg,image/png,image/webp,image/gif" /></label>
            </div>
            <label>Logo URL<input name="logoUrl" placeholder="可粘贴已有图片地址，也可上传文件" /></label>
            <label>简介<textarea name="description" rows="5"></textarea></label>
            <div class="form-actions">
              <button class="button primary" type="submit">保存</button>
              <button class="button outline" type="button" data-cancel-friend-edit hidden>取消编辑</button>
            </div>
            <p class="form-message" data-friend-message></p>
          </form>

          <aside class="panel-block sticky-panel">
            <p class="section-kicker">说明</p>
            <h3>朋友主体不是活动模块。</h3>
            <p class="muted-text">模块回答“活动是什么类型”，朋友主体回答“这个活动以谁的客厅名义发起”。</p>
            <a class="button ghost" href="admin.html">回后台</a>
          </aside>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <form class="filter-panel" data-friend-filters>
            <label>搜索<input name="q" placeholder="名称 / 地址 / 联系人" /></label>
            <button class="button ghost" type="submit">筛选</button>
          </form>
          <div class="list-toolbar">
            <span data-friend-count>正在读取客厅朋友...</span>
          </div>
          <div class="event-list rows" data-friend-list></div>
          <button class="button ghost load-more" type="button" data-load-more-friends hidden>加载更多</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-grid">
        <div><div class="footer-brand">有空客厅</div><div>朋友主体让活动地图更真实。</div><div class="credit">网站制作人：海旭</div></div>
        <nav class="footer-links"><a href="admin.html">后台</a><a href="admin-activities.html">全部活动</a><a href="admin-feedbacks.html">活动反馈</a><a href="admin-logs.html">操作日志</a></nav>
      </div>
    </footer>
    <script src="script.js?v=0.23.4"></script>
    <script src="app.js?v=0.23.4"></script>
  </body>
</html>
